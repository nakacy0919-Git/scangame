name: One-time safe npm advisory remediation
on:
  push:
    branches: [fix/security-and-gameplay-20261117]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-fund
      - name: Apply non-breaking patched dependency versions
        run: npm audit fix --ignore-scripts --no-fund || true
      - run: npm ci --ignore-scripts --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Commit dependency updates
        run: |
          if ! git diff --quiet -- package.json package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "fix: patch vulnerable npm dependencies without force"
            git push origin HEAD:refs/heads/fix/security-and-gameplay-20261117
          fi
