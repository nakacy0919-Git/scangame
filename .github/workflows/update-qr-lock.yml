name: Temporary QR dependency lockfile sync
on:
  push:
    branches: [fix/security-and-gameplay-20261117]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - name: Commit updated dependency lock
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'chore: lock local QR code generator dependency'
            git push origin HEAD:refs/heads/fix/security-and-gameplay-20261117
          fi
