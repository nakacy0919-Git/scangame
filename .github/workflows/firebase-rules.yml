name: Firebase Rules Emulator
on:
  workflow_dispatch:
  push:
    branches: [main, fix/security-and-gameplay-20261117]
    paths:
      - database.rules.json
      - tests/firebaseRulesEmulator.mjs
      - firebase.json
      - .github/workflows/firebase-rules.yml
  pull_request:
    paths:
      - database.rules.json
      - tests/firebaseRulesEmulator.mjs
      - firebase.json
      - .github/workflows/firebase-rules.yml

permissions:
  contents: read

jobs:
  verify-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: npm ci --no-fund
      - name: Install isolated Firebase rules testing package
        run: npm install --no-save --package-lock=false --legacy-peer-deps --ignore-scripts @firebase/rules-unit-testing@6.0.0
      - name: Test database permissions without touching production
        run: npx -y firebase-tools@15.36.0 emulators:exec --only database --project demo-scannect "node tests/firebaseRulesEmulator.mjs"
