name: Scannect quality and security checks
on:
  push:
    branches:
      - main
      - fix/security-and-gameplay-20261117
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Audit all frontend dependencies (including build tools)
        run: npm audit --audit-level=high
      - name: Install locked secure scoring server dependencies
        run: npm --prefix functions ci
      - name: Validate scoring server and mission tests
        run: |
          npm --prefix functions run lint
          npm --prefix functions test
          node -e "require('./functions/index.cjs')"
      - name: Audit the scoring server production dependencies
        run: npm --prefix functions audit --omit=dev --audit-level=high
